# ============================================================
# Application Configuration
# ============================================================

# Base URL of the application under test
base.url=https://opensource-demo.orangehrmlive.com/web/index.php/auth/login

# Expected Login Page URL
login.page.url=https://opensource-demo.orangehrmlive.com/web/index.php/auth/login

# Expected Forgot Password Page URL
forgot.password.url=https://opensource-demo.orangehrmlive.com/web/index.php/auth/requestPasswordResetCode

# ============================================================
# Browser Configuration
# ============================================================

# Browser: chrome | firefox | edge
browser=chrome

# Run in headless mode: true | false
headless=false

# Implicit Wait (seconds)
implicit.wait=10

# Explicit Wait (seconds)
explicit.wait=15

# Page Load Timeout (seconds)
page.load.timeout=30

# ============================================================
# Valid Credentials
# ============================================================
valid.username=Admin
valid.password=admin123

# ============================================================
# Screenshot Configuration
# ============================================================
# on failure: take screenshot automatically
screenshot.on.failure=true
screenshot.dir=screenshots/

# ============================================================
# Report Configuration
# ============================================================
report.dir=reports/
report.name=AutomationReport.html
